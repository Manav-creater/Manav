<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eye Blink Counter</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #07111f, #102a43, #164e63);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 25px;
      padding: 25px;
      text-align: center;
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #b8d7e8;
      margin-bottom: 20px;
    }

    .camera-box {
      position: relative;
      width: 100%;
      max-width: 720px;
      margin: auto;
      overflow: hidden;
      border-radius: 20px;
      background: #000;
      border: 3px solid rgba(255,255,255,0.15);
    }

    video {
      width: 100%;
      display: block;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    .status {
      margin-top: 18px;
      font-size: 18px;
      font-weight: bold;
    }

    .count-box {
      margin: 20px auto;
      padding: 18px;
      max-width: 300px;
      border-radius: 18px;
      background: rgba(0,0,0,0.25);
    }

    .count {
      font-size: 60px;
      font-weight: bold;
      color: #38bdf8;
    }

    .label {
      color: #cbd5e1;
      font-size: 15px;
    }

    button {
      border: none;
      padding: 13px 28px;
      border-radius: 12px;
      background: #0ea5e9;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s;
    }

    button:hover {
      transform: translateY(-2px) scale(1.03);
      background: #0284c7;
      box-shadow: 0 8px 25px rgba(14,165,233,0.35);
    }

    .error {
      color: #fca5a5;
      margin-top: 15px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 28px;
      }

      .count {
        font-size: 48px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>👁️ Eye Blink Counter</h1>
    <p class="subtitle">Look at the camera and blink naturally.</p>

    <div class="camera-box">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="canvas"></canvas>
    </div>

    <div class="status" id="status">
      Starting camera...
    </div>

    <div class="count-box">
      <div class="count" id="blinkCount">0</div>
      <div class="label">TOTAL BLINKS</div>
    </div>

    <button onclick="resetCounter()">Reset Counter</button>

    <div class="error" id="error"></div>

  </div>


  <!-- MediaPipe libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

  <script>

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const blinkCountElement = document.getElementById("blinkCount");
    const statusElement = document.getElementById("status");
    const errorElement = document.getElementById("error");

    let blinkCount = 0;

    // Prevent one blink from being counted multiple times
    let eyesClosed = false;

    // Eye closure threshold
    const EAR_THRESHOLD = 0.21;

    // Calculate distance between two points
    function distance(a, b) {
      return Math.sqrt(
        Math.pow(a.x - b.x, 2) +
        Math.pow(a.y - b.y, 2)
      );
    }

    // Calculate Eye Aspect Ratio
    function eyeAspectRatio(landmarks, points) {

      const p1 = landmarks[points[0]];
      const p2 = landmarks[points[1]];
      const p3 = landmarks[points[2]];
      const p4 = landmarks[points[3]];
      const p5 = landmarks[points[4]];
      const p6 = landmarks[points[5]];

      const vertical1 = distance(p2, p6);
      const vertical2 = distance(p3, p5);

      const horizontal = distance(p1, p4);

      return (vertical1 + vertical2) / (2 * horizontal);
    }


    const faceMesh = new FaceMesh({
      locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
      }
    });


    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });


    faceMesh.onResults((results) => {

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!results.multiFaceLandmarks ||
          results.multiFaceLandmarks.length === 0) {

        statusElement.textContent = "👤 No face detected";
        return;
      }

      statusElement.textContent = "🟢 Face detected — blink normally";

      const landmarks = results.multiFaceLandmarks[0];

      /*
        MediaPipe eye landmark points

        Left eye:
        33, 160, 158, 133, 153, 144

        Right eye:
        362, 385, 387, 263, 373, 380
      */

      const leftEAR = eyeAspectRatio(
        landmarks,
        [33, 160, 158, 133, 153, 144]
      );

      const rightEAR = eyeAspectRatio(
        landmarks,
        [362, 385, 387, 263, 373, 380]
      );

      const averageEAR = (leftEAR + rightEAR) / 2;


      // Eyes closed
      if (averageEAR < EAR_THRESHOLD) {

        if (!eyesClosed) {
          eyesClosed = true;
        }

      }

      // Eyes opened again = one complete blink
      else {

        if (eyesClosed) {

          blinkCount++;

          blinkCountElement.textContent = blinkCount;

          statusElement.textContent =
            "👁️ Blink detected!";

          eyesClosed = false;
        }
      }


      // Draw face landmarks
      drawConnectors(
        ctx,
        landmarks,
        FACEMESH_TESSELATION,
        {
          color: "rgba(56,189,248,0.18)",
          lineWidth: 1
        }
      );

    });


    // Start camera
    async function startCamera() {

      try {

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: 640,
            height: 480,
            facingMode: "user"
          },
          audio: false
        });

        video.srcObject = stream;

        const camera = new Camera(video, {
          onFrame: async () => {
            await faceMesh.send({
              image: video
            });
          },

          width: 640,
          height: 480
        });

        camera.start();

      } catch (error) {

        statusElement.textContent = "❌ Camera unavailable";

        errorElement.textContent =
          "Please allow camera permission and open this page using Live Server or HTTPS.";

        console.error(error);
      }
    }


    function resetCounter() {

      blinkCount = 0;
      eyesClosed = false;

      blinkCountElement.textContent = "0";

      statusElement.textContent =
        "🟢 Counter reset — blink normally";
    }


    startCamera();

  </script>

</body>
</html>
